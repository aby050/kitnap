<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <!--
    Wend wordmark: a heavy rounded lowercase "w" (three strokes: down / up /
    down, round caps and joins) followed by an apostrophe.
    Drawn on a 100x100 grid so it scales cleanly to every icon size.
  -->
  <g fill="none" stroke="#000000" stroke-width="20" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 26 29 L 41 71 L 56 32 L 71 71" />
  </g>
  <!-- Apostrophe: round bowl with a tapering tail -->
  <circle cx="86" cy="32" r="9.5" fill="#000000" />
  <path d="M 88.5 39.5 C 88.5 45.5 85.5 50.5 80.5 53.5 C 78.4 54.7 77.1 52.6 79.1 51.1 C 82.2 48.8 84.2 45.2 84.4 41 Z" fill="#000000" />
</svg>
